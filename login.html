<!DOCTYPE html>
<html>
<head>
    <title>AI Recruitment - System Access</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap');

        :root { --neon: #00f2ff; --bg: #050505; }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: radial-gradient(ellipse at 30% 20%, #0a1a2e 0%, #050505 60%);
            font-family: 'Rajdhani', sans-serif;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Background grid effect */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(0,242,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,242,255,0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
        }

        .wrapper {
            display: flex;
            width: 850px;
            min-height: 500px;
            border: 1px solid rgba(0,242,255,0.15);
            border-radius: 24px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 0 80px rgba(0,242,255,0.05);
            z-index: 1;
        }

        /* LEFT PANEL */
        .left-panel {
            width: 340px;
            background: linear-gradient(160deg, #0a1f35 0%, #050d1a 100%);
            padding: 50px 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border-right: 1px solid rgba(0,242,255,0.1);
            position: relative;
            overflow: hidden;
        }

        .left-panel::after {
            content: '';
            position: absolute;
            bottom: -100px;
            left: -100px;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0,242,255,0.08) 0%, transparent 70%);
        }

        .brand { position: relative; z-index: 1; }

        .brand-icon {
            width: 48px;
            height: 48px;
            border: 1.5px solid var(--neon);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
        }

        .brand-icon svg { width: 24px; height: 24px; stroke: var(--neon); fill: none; stroke-width: 1.5; }

        .brand h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: white;
            letter-spacing: 3px;
            text-transform: uppercase;
            line-height: 1.2;
            margin-bottom: 12px;
        }

        .brand h1 span { color: var(--neon); }

        .brand p {
            font-size: 0.85rem;
            color: rgba(255,255,255,0.4);
            letter-spacing: 1px;
            line-height: 1.6;
        }

        .stats { position: relative; z-index: 1; }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--neon);
            box-shadow: 0 0 8px var(--neon);
            flex-shrink: 0;
        }

        .stat-item p {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.35);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin: 0;
        }

        .stat-item strong {
            display: block;
            font-size: 1rem;
            color: rgba(255,255,255,0.8);
            font-weight: 600;
        }

        /* RIGHT PANEL */
        .right-panel {
            flex: 1;
            background: rgba(8, 8, 12, 0.98);
            padding: 50px 45px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .right-panel h2 {
            font-size: 1.1rem;
            font-weight: 700;
            color: rgba(255,255,255,0.5);
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .right-panel h3 {
            font-size: 1.8rem;
            font-weight: 700;
            color: white;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 35px;
        }

        .error-msg {
            background: rgba(255,49,49,0.08);
            border: 1px solid rgba(255,49,49,0.3);
            border-radius: 8px;
            padding: 12px 16px;
            color: #ff6b6b;
            font-size: 0.85rem;
            letter-spacing: 1px;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 22px;
            position: relative;
        }

        .input-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            color: rgba(0,242,255,0.6);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .input-wrapper { position: relative; }

        .input-wrapper svg {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            stroke: rgba(255,255,255,0.25);
            fill: none;
            stroke-width: 1.5;
            pointer-events: none;
        }

        .input-group input {
            width: 100%;
            padding: 14px 14px 14px 42px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            color: white;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: 1px;
            outline: none;
            transition: all 0.3s;
            box-sizing: border-box;
        }

        .input-group input::placeholder { color: rgba(255,255,255,0.2); }

        .input-group input:focus {
            border-color: rgba(0,242,255,0.4);
            background: rgba(0,242,255,0.04);
        }

        .btn-login {
            width: 100%;
            padding: 15px;
            background: var(--neon);
            border: none;
            border-radius: 10px;
            color: #000;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1rem;
            font-weight: 800;
            letter-spacing: 3px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .btn-login:hover {
            box-shadow: 0 0 30px rgba(0,242,255,0.4);
            opacity: 0.9;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 25px 0;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255,255,255,0.08);
        }

        .divider span {
            font-size: 0.75rem;
            color: rgba(255,255,255,0.25);
            letter-spacing: 2px;
        }

        .links {
            display: flex;
            justify-content: space-between;
        }

        .links a {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.3);
            text-decoration: none;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: color 0.2s;
        }

        .links a:hover { color: var(--neon); }
    </style>
</head>
<body>
    <div class="wrapper">
        <!-- LEFT PANEL -->
        <div class="left-panel">
            <div class="brand">
                <div class="brand-icon">
                    <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
                </div>
                <h1>AI <span>Recruit</span><br>Engine</h1>
                <p>Next-generation candidate<br>screening powered by AI</p>
            </div>

            <div class="stats">
                <div class="stat-item">
                    <div class="stat-dot"></div>
                    <div>
                        <strong>15 Roles</strong>
                        <p>Supported designations</p>
                    </div>
                </div>
                <div class="stat-item">
                    <div class="stat-dot"></div>
                    <div>
                        <strong>XGBoost v8</strong>
                        <p>ML Model powering decisions</p>
                    </div>
                </div>
                <div class="stat-item">
                    <div class="stat-dot"></div>
                    <div>
                        <strong>AI Insights</strong>
                        <p>Groq LLaMA recommendations</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- RIGHT PANEL -->
        <div class="right-panel">
            <h2>Welcome back</h2>
            <h3>System Access</h3>

            {% if error %}
                <div class="error-msg">⚠ {{ error }}</div>
            {% endif %}

            <form action="/login_action" method="POST">
                <div class="input-group">
                    <label>Email</label>
                    <div class="input-wrapper">
                        <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                        <input type="email" name="email" placeholder="admin@domain.com" required>
                    </div>
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        <input type="password" name="password" placeholder="••••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn-login">Log In</button>
            </form>

            <div class="divider"><span>OR</span></div>

            <div class="links">
                <a href="#">Forgot Password</a>
                <a href="/signup">Create Account</a>
            </div>
        </div>
    </div>
</body>
</html>
